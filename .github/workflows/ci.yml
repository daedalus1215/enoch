name: CI

on:
  push:
    branches: [main]
  # Every PR, whatever its base, so stacked PRs are checked too.
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Default features: CLI, TUI, window and tray.
      - run: cargo test --locked
      # The lean build: CLI and TUI only.
      - run: cargo test --locked --no-default-features
