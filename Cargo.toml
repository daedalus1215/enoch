[package]
name = "enoch"
version = "0.1.0"
edition = "2024"
description = "Track how long you have been doing activities"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
# OpenGL (glow) renderer rather than eframe's default wgpu: it works on any
# Mesa GL driver without a Vulkan ICD, and compiles far less.
eframe = { version = "0.37", optional = true, default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
ratatui = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }

# Tray icon backends. Linux and the BSDs: a StatusNotifierItem over D-Bus.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"], optional = true }
# Idle detection (ext-idle-notify-v1) and the notification offering to drop
# time away. Both are already in the build through winit and ksni.
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

# macOS: a menu bar item, driven by a winit event loop (the same winit the
# window uses). The window uses winit directly too, to be a regular app
# even inside enoch.app.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false, optional = true }
winit = { version = "0.30", default-features = false, optional = true }
# Notifications with buttons for time away (UserNotifications), when run as
# enoch.app; the same objc2 generation tray-icon uses.
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSError",
    "NSObject",
    "NSSet",
    "NSString",
] }
objc2-user-notifications = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[dev-dependencies]
# Drives the window's views in tests: clicks and keys through AccessKit,
# with no display.
egui_kittest = "0.37"

[profile.release]
lto = true
strip = true

[features]
default = ["gui", "tray"]
# Build without these for a lean CLI + TUI: cargo build --no-default-features
# Desktop window (`enoch gui`).
gui = ["dep:eframe", "dep:winit"]
# Tray icon (`enoch tray`): StatusNotifierItem hosts (Waybar, KDE, ...) on
# Linux, the menu bar on macOS.
tray = [
    "dep:block2",
    "dep:ksni",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-user-notifications",
    "dep:tray-icon",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:winit",
    "dep:zbus",
]
