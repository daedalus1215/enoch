[package]
name = "enoch"
version = "0.1.0"
edition = "2024"
description = "Track how long you have been doing activities"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = true
strip = true
